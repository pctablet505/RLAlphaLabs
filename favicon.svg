<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1930"/>
      <stop offset="100%" stop-color="#030812"/>
    </linearGradient>
    <linearGradient id="rim" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sigGrad" x1="12" y1="16" x2="54" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- Subtle Quant Grid -->
  <path d="M16 2v60M32 2v60M48 2v60M2 16h60M2 32h60M2 48h60" stroke="#00d2ff" stroke-opacity="0.065" stroke-width="1"/>
  <!-- Outer Precision Border -->
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" stroke="url(#rim)" stroke-width="1.6"/>
  <!-- Ascending Quant Signal Arc (Top-Right Accent) -->
  <path d="M36 14.5L42 10.5L46 13.2L52.5 8.5" stroke="url(#sigGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52.5" cy="8.5" r="2.5" fill="#10b981"/>
  <!-- Geometric 'R' -->
  <path d="M9.5 39V21.5H16C19 21.5 20.8 23.1 20.8 25.8C20.8 28.5 19 30.1 16 30.1H9.5M15.3 30.1L21 39" stroke="#f8fafc" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Geometric 'L' -->
  <path d="M25.5 21.5V39H33.2" stroke="#f8fafc" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Continuous Single-Stroke Alpha 'α' -->
  <path d="M53.5 24.2C51 32.2 48 39.2 42.8 39.2C39 39.2 36.8 35.8 36.8 31.7C36.8 27.6 39 24.2 42.8 24.2C48 24.2 50.3 31.7 52.4 37.4C52.9 38.6 53.7 39.2 54.8 39.2" stroke="#00d2ff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom 'LABS' Track -->
  <line x1="10.5" y1="45.5" x2="53.5" y2="45.5" stroke="#00d2ff" stroke-opacity="0.28" stroke-width="1"/>
  <text x="32" y="54.5" text-anchor="middle" font-family="'JetBrains Mono', 'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="8.2" letter-spacing="3.2" fill="#94a3b8">LABS</text>
</svg>
