  <circle cx="52.5" cy="10.2" r="2.6" fill="#10b981"/>
  <!-- Single-Stroke Continuous Geometric Alpha (α) + Coordinate Axis L Monogram -->
  <path d="M36 23.5C32.5 34.2 28.2 44 20.8 44C15.2 44 12 39.3 12 33.8C12 28.2 15.2 23.5 20.8 23.5C28.2 23.5 31.5 33.8 34.5 41.5C35.2 43.2 36.4 44 38 44" stroke="url(#alphaGrad)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crisp 'L' Coordinate Axis -->
  <path d="M44 23.5V44H52.5" stroke="#00d2ff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
